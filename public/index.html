<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AquaCare — Smart Water Leakage Reporting System. Report water leakages, track complaints, and help your community.">
  <title>AquaCare — Smart Water Leakage Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo" onclick="navigateTo('home')">
        <span class="material-icons-round">water_drop</span>
        <span>AquaCare</span>
      </a>
      <div class="nav-links">
        <a href="#" onclick="navigateTo('home')" data-page="home">Home</a>
        <a href="#" onclick="navigateTo('report')" data-page="report">Report Issue</a>
        <a href="#" onclick="navigateTo('track')" data-page="track">Track Complaint</a>
        <a href="#" onclick="navigateTo('worker-login')" data-page="worker-login">Worker</a>
        <a href="#" onclick="navigateTo('admin-login')" data-page="admin-login" class="nav-admin-btn">Admin</a>
      </div>
      <button class="nav-mobile-btn" onclick="toggleMobileMenu()">
        <span class="material-icons-round">menu</span>
      </button>
    </div>
    <div class="nav-mobile-menu" id="mobileMenu">
      <a href="#" onclick="navigateTo('home')">Home</a>
      <a href="#" onclick="navigateTo('report')">Report Issue</a>
      <a href="#" onclick="navigateTo('track')">Track Complaint</a>
      <a href="#" onclick="navigateTo('worker-login')" data-page="worker-login">Worker Portal</a>
      <a href="#" onclick="navigateTo('admin-login')" data-page="admin-login">Admin Portal</a>
    </div>
  </nav>

  <!-- PAGE CONTAINER -->
  <main id="app"></main>

  <!-- TEMPLATES -->

  <!-- HOME PAGE -->
  <template id="tpl-home">
    <div class="hero">
      <div class="hero-content">
        <div class="hero-badge">🏛️ Municipal Water Services</div>
        <h1>Report Water Leakages.<br><span class="gradient-text">Protect Your Community.</span></h1>
        <p class="hero-subtitle">AquaCare helps citizens report water leakages, pipe bursts, and water wastage directly to municipal authorities. Track your complaint in real-time.</p>
        <div class="hero-actions">
          <button class="btn btn-primary btn-lg" onclick="navigateTo('report')">
            <span class="material-icons-round">campaign</span>
            Report a Leakage
          </button>
          <button class="btn btn-outline btn-lg" onclick="navigateTo('track')">
            <span class="material-icons-round">search</span>
            Track Complaint
          </button>
        </div>
      </div>
      <div class="hero-visual">
        <div class="hero-card">
          <div class="hero-card-icon"><span class="material-icons-round">speed</span></div>
          <h3>Quick Reporting</h3>
          <p>Submit a complaint in under 2 minutes</p>
        </div>
        <div class="hero-card">
          <div class="hero-card-icon"><span class="material-icons-round">location_on</span></div>
          <h3>Location Based</h3>
          <p>Pinpoint the exact leakage location</p>
        </div>
        <div class="hero-card">
          <div class="hero-card-icon"><span class="material-icons-round">track_changes</span></div>
          <h3>Real-time Tracking</h3>
          <p>Follow your complaint from submission to resolution</p>
        </div>
      </div>
    </div>

    <section class="how-it-works">
      <div class="how-it-works-inner">
        <h2>How It Works</h2>
        <div class="steps-grid">
          <div class="step-card">
            <div class="step-number">1</div>
            <h3>Report</h3>
            <p>Fill in the details about the water leakage and upload a photo.</p>
          </div>
          <div class="step-connector"><span class="material-icons-round">arrow_forward</span></div>
          <div class="step-card">
            <div class="step-number">2</div>
            <h3>Get Complaint ID</h3>
            <p>Receive a unique Complaint ID to track your report's progress.</p>
          </div>
          <div class="step-connector"><span class="material-icons-round">arrow_forward</span></div>
          <div class="step-card">
            <div class="step-number">3</div>
            <h3>Resolution</h3>
            <p>Our maintenance team addresses the issue and updates the status.</p>
          </div>
        </div>
      </div>
    </section>
  </template>

  <!-- REPORT FORM -->
  <template id="tpl-report">
    <div class="page-container">
      <div class="page-header">
        <h1><span class="material-icons-round">campaign</span> Report Water Leakage</h1>
        <p>Help us fix water issues in your area. Fill in the details below.</p>
      </div>
      <form class="form-card" id="reportForm" onsubmit="submitComplaint(event)">
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number <span class="required">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="Enter 10 digit mobile number" pattern="\d{10}" title="Mobile number must be exactly 10 digits" required>
        </div>
        <div class="form-group">
          <label for="category">Category <span class="required">*</span></label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Select an issue category...</option>
            <option value="Pipeline Leakage">Pipeline Leakage</option>
            <option value="Overflowing Water Tank">Overflowing Water Tank</option>
            <option value="Damaged Public Tap">Damaged Public Tap</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="location">Location / Address <span class="required">*</span></label>
          <input type="text" id="location" name="location" placeholder="e.g., Near Sector 21 park, Main Road" required>
        </div>
        <div class="form-group">
          <label for="description">Description <span class="required">*</span></label>
          <textarea id="description" name="description" rows="4" placeholder="Describe the water leakage issue in detail..." required></textarea>
        </div>
        <div class="form-group">
          <label for="image">Upload Photo (optional)</label>
          <div class="file-upload-area" id="fileUploadArea">
            <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)" hidden>
            <div class="file-upload-placeholder" id="uploadPlaceholder" onclick="openPhotoChoiceModal()">
              <span class="material-icons-round" style="font-size: 40px; margin-bottom: 8px;">add_a_photo</span>
              <p><strong>Add a photo of the leakage (optional)</strong></p>
              <span class="file-hint">JPG, PNG or WebP — max 5MB</span>
            </div>
            <div class="file-preview" id="filePreview" style="display:none;">
              <img id="previewImg" alt="Preview">
              <button type="button" class="btn btn-sm btn-danger" onclick="clearImage()">Remove</button>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full" id="submitBtn">
          <span class="material-icons-round">send</span>
          Submit Complaint
        </button>
      </form>
    </div>

    <!-- Photo Choice Modal -->
    <div id="photoChoiceModal" class="modal" style="display:none;">
      <div class="modal-content form-card" style="max-width: 340px; text-align: center; padding: 24px;">
        <h2 style="font-size: 1.2rem; margin-bottom: 20px;">Upload Photo</h2>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button type="button" class="btn btn-primary btn-full" onclick="triggerCamera()">
            <span class="material-icons-round">photo_camera</span> Take Photo
          </button>
          <button type="button" class="btn btn-outline btn-full" onclick="triggerGallery()">
            <span class="material-icons-round">photo_library</span> Choose from Gallery
          </button>
          <button type="button" class="btn btn-ghost btn-full" onclick="closePhotoChoiceModal()">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- CONFIRMATION -->
  <template id="tpl-confirmation">
    <div class="page-container confirmation-page">
      <div class="confirmation-card">
        <div class="confirmation-icon">
          <span class="material-icons-round">check_circle</span>
        </div>
        <h1>Complaint Submitted!</h1>
        <p>Your complaint has been registered successfully. Save this Complaint ID to track your issue:</p>
        <div class="complaint-id-display" id="confirmationId">—</div>
        <div class="confirmation-actions">
          <button class="btn btn-primary" onclick="copyComplaintId()">
            <span class="material-icons-round">content_copy</span>
            Copy ID
          </button>
          <button class="btn btn-outline" onclick="navigateTo('track')">
            <span class="material-icons-round">search</span>
            Track Complaint
          </button>
        </div>
        <button class="btn btn-ghost" onclick="navigateTo('home')">← Back to Home</button>
      </div>
    </div>
  </template>

  <!-- TRACK COMPLAINT -->
  <template id="tpl-track">
    <div class="page-container">
      <div class="page-header">
        <h1><span class="material-icons-round">search</span> Track Your Complaint</h1>
        <p>Enter your Complaint ID to check the current status.</p>
      </div>
      <div class="form-card track-form">
        <div class="track-input-group">
          <input type="text" id="trackInput" placeholder="Enter Complaint ID (e.g., AQ-1A2B3C4D)" class="track-input">
          <button class="btn btn-primary" onclick="trackComplaint()">
            <span class="material-icons-round">search</span>
            Track
          </button>
        </div>
      </div>
      <div id="trackResult"></div>
    </div>
  </template>

  <!-- TRACK RESULT -->
  <template id="tpl-track-result">
    <div class="track-result-card">
      <div class="track-result-header">
        <div>
          <span class="track-result-id"></span>
          <span class="status-badge"></span>
        </div>
        <span class="track-result-date"></span>
      </div>
      <div class="track-result-body">
        <div class="track-detail"><strong>Name:</strong> <span class="detail-name"></span></div>
        <div class="track-detail"><strong>Location:</strong> <span class="detail-location"></span></div>
        <div class="track-detail"><strong>Description:</strong> <span class="detail-description"></span></div>
        <div class="track-detail detail-team" style="display:none;"><strong>Assigned Team:</strong> <span class="detail-assigned"></span></div>
        <div class="track-detail detail-workers" style="display:none;"><strong>Assigned Workers:</strong> <span class="detail-workers-text"></span></div>
        <div class="track-detail detail-deadline" style="display:none;">
          <strong>Deadline:</strong> <span class="detail-deadline-text"></span> 
          <span class="detail-overdue-badge status-badge" style="display:none; background:#ffebee; color:#c62828; font-size:0.8rem; margin-left:8px;">Overdue</span>
        </div>
        <div class="track-image-container" style="display:none;">
          <strong>Photo:</strong>
          <img class="track-image" alt="Complaint photo">
        </div>
      </div>

      <!-- Chronological Status History -->
      <div style="margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1rem;">
        <h3 style="margin-top:0; font-size: 1.1rem;">Status History</h3>
        <ul id="timelineList" style="list-style-type: none; padding-left: 0; margin-top: 10px; font-size: 0.9rem; color: #555;">
          <!-- Populated by JS -->
        </ul>
        <p id="timelineEmpty" style="display:none; color: #999; font-size: 0.9rem;">No history available.</p>
      </div>

      <!-- Approved Completion Evidence -->
      <div id="completionEvidence" style="display:none; margin-top: 1rem; padding: 1rem; background: #f1f8e9; border-left: 4px solid #4caf50; border-radius: 4px;">
        <h3 style="color: #2e7d32; margin:0 0 10px 0; font-size: 1.1rem;"><span class="material-icons-round" style="vertical-align: middle; font-size:1.2rem;">verified</span> Completion Report</h3>
        <p style="margin: 0 0 10px 0; font-size: 0.95rem;"><strong>Notes:</strong> <span id="completionNotes"></span></p>
        <div id="completionImageContainer" style="display:none;">
          <img id="completionImage" style="max-width: 100%; border-radius: 4px; max-height: 300px; object-fit: contain;" alt="Completion Evidence">
        </div>
      </div>
    </div>
  </template>

  <!-- ADMIN LOGIN -->
  <template id="tpl-admin-login">
    <div class="page-container">
      <div class="login-card">
        <div class="login-icon">
          <span class="material-icons-round">admin_panel_settings</span>
        </div>
        <h1>Admin Portal</h1>
        <p>Sign in to manage complaints</p>
        <form onsubmit="adminLogin(event)">
          <div class="form-group">
            <label for="adminUser">Username</label>
            <input type="text" id="adminUser" placeholder="Enter username" required>
          </div>
          <div class="form-group">
            <label for="adminPass">Password</label>
            <input type="password" id="adminPass" placeholder="Enter password" required>
          </div>
          <div id="loginError" class="error-message" style="display:none;"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-full">
            <span class="material-icons-round">login</span>
            Sign In
          </button>
        </form>
      </div>
    </div>
  </template>

  <!-- ADMIN DASHBOARD -->
  <template id="tpl-dashboard">
    <div class="dashboard">
      <div class="dashboard-header">
        <div>
          <h1><span class="material-icons-round">dashboard</span> Admin Dashboard</h1>
          <p>Manage and resolve water leakage complaints</p>
        </div>
        <div>
          <button class="btn btn-outline btn-sm" onclick="showTeamsModal()">
            <span class="material-icons-round">groups</span> Manage Teams
          </button>
          <button class="btn btn-outline btn-sm" onclick="showWorkersModal()" style="margin-left: 8px;">
            <span class="material-icons-round">engineering</span> Manage Workers
          </button>
          <button class="btn btn-outline btn-sm" onclick="showChangePasswordModal()" style="margin-left: 8px;">
            <span class="material-icons-round">vpn_key</span> Change Password
          </button>
          <button class="btn btn-outline btn-sm" onclick="adminLogout()" style="margin-left: 8px;">
            <span class="material-icons-round">logout</span> Logout
          </button>
        </div>
      </div>

      <!-- Change Password Modal (Hidden by default) -->
      <div id="changePasswordModal" class="modal" style="display:none;">
        <div class="modal-content form-card">
          <div class="modal-header">
            <h2>Change Password</h2>
            <span class="close-modal" onclick="closeChangePasswordModal()">&times;</span>
          </div>
          <form onsubmit="changePassword(event)">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm New Password</label>
              <input type="password" id="confirmPassword" required>
            </div>
            <div id="pwdError" class="error-message" style="display:none;"></div>
            <button type="submit" class="btn btn-primary btn-full">
              Update Password
            </button>
          </form>
        </div>
      </div>
      
      <!-- Workers Modal -->
      <div id="workersModal" class="modal" style="display:none;">
        <div class="modal-content form-card" style="max-width: 600px;">
          <div class="modal-header">
            <h2>Maintenance Directory</h2>
            <span class="close-modal" onclick="closeWorkersModal()">&times;</span>
          </div>
          
          <div style="margin-bottom: 24px; padding: 16px; background: var(--bg-color); border-radius: 8px;">
            <h3 style="font-size: 1rem; margin-bottom: 12px;">Add New Worker</h3>
            <form onsubmit="createWorker(event)" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <input type="text" id="wName" placeholder="Full Name" required>
              <input type="tel" id="wPhone" placeholder="10-digit Phone" pattern="\d{10}" required>
              <input type="text" id="wUsername" placeholder="Username" required>
              <input type="password" id="wPassword" placeholder="Password" required>
              <button type="submit" class="btn btn-primary" style="grid-column: span 2;">Add Worker</button>
            </form>
          </div>
          
          <div id="workersList" style="display: flex; flex-direction: column; gap: 12px; max-height: 300px; overflow-y: auto;">
            <!-- Render workers here -->
          </div>
        </div>
      </div>
      
      <!-- Teams Modal -->
      <div id="teamsModal" class="modal" style="display:none;">
        <div class="modal-content form-card" style="max-width: 600px;">
          <div class="modal-header">
            <h2>Maintenance Teams</h2>
            <span class="close-modal" onclick="closeTeamsModal()">&times;</span>
          </div>
          
          <div style="margin-bottom: 24px; padding: 16px; background: var(--bg-color); border-radius: 8px;">
            <h3 style="font-size: 1rem; margin-bottom: 12px;">Create New Team</h3>
            <form onsubmit="createTeam(event)" style="display: flex; gap: 12px;">
              <input type="text" id="tName" placeholder="Team Name" required style="flex: 1;">
              <button type="submit" class="btn btn-primary">Create</button>
            </form>
          </div>
          
          <div id="teamsList" style="display: flex; flex-direction: column; gap: 12px; max-height: 300px; overflow-y: auto;">
            <!-- Render teams here -->
          </div>
        </div>
      </div>

      <!-- Team Members Modal -->
      <div id="teamMembersModal" class="modal" style="display:none;">
        <div class="modal-content form-card" style="max-width: 600px;">
          <div class="modal-header">
            <h2 id="teamMembersTitle">Team Members</h2>
            <span class="close-modal" onclick="closeTeamMembersModal()">&times;</span>
          </div>
          
          <div style="margin-bottom: 24px; padding: 16px; background: var(--bg-color); border-radius: 8px;">
            <h3 style="font-size: 1rem; margin-bottom: 12px;">Assign Worker</h3>
            <div style="display: flex; gap: 12px;">
              <select id="workerSelect" style="flex: 1;">
                <option value="" disabled selected>Select a worker...</option>
              </select>
              <button class="btn btn-primary" onclick="addWorkerToTeam()">Add</button>
            </div>
          </div>
          
          <div id="teamMembersList" style="display: flex; flex-direction: column; gap: 12px; max-height: 300px; overflow-y: auto;">
            <!-- Render members here -->
          </div>
        </div>
      </div>
      
      <!-- Delete Complaint Modal -->
      <div id="deleteComplaintModal" class="modal" style="display:none;">
        <div class="modal-content form-card">
          <div class="modal-header">
            <h2>Delete Complaint</h2>
            <span class="close-modal" onclick="closeDeleteModal()">&times;</span>
          </div>
          <p style="margin-bottom: 20px;">Are you sure you want to permanently delete this complaint?</p>
          <div id="deleteError" class="error-message" style="display:none;"></div>
          <div style="display: flex; gap: 12px; justify-content: flex-end;">
            <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>

      <!-- Pending Verification Section -->
      <div id="pendingVerificationSection" style="margin-top: 2rem; display: none;">
        <h3 style="font-size: 1.25rem; margin-bottom: 1rem; color: #f57c00;"><span class="material-icons-round" style="vertical-align: middle;">pending_actions</span> Pending Verification</h3>
        <div id="pendingReportsList" class="complaints-list">
          <p class="loading-text">Loading pending reports...</p>
        </div>
      </div>

      <!-- Verify Report Modal -->
      <div id="verifyReportModal" class="modal" style="display:none;">
        <div class="modal-content form-card" style="max-width: 600px;">
          <div class="modal-header">
            <h2>Verify Work Report</h2>
            <span class="close-modal" onclick="closeVerifyModal()">&times;</span>
          </div>
          <div id="verifyReportDetails" style="margin-bottom: 1.5rem;"></div>
          <form onsubmit="submitVerification(event)">
            <input type="hidden" id="verifyComplaintId">
            <div class="form-group" id="rejectionReasonGroup" style="display:none;">
              <label for="rejectionReason">Rejection Reason <span style="color:red;">*</span></label>
              <textarea id="rejectionReason" rows="3" placeholder="Explain why the work is rejected..."></textarea>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1rem;">
              <button type="button" class="btn btn-danger" onclick="toggleRejectionReason()">Reject</button>
              <button type="submit" class="btn btn-primary" id="approveBtn">Approve Work</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid" style="margin-top: 2rem;">
        <div class="stat-card stat-total"><div class="stat-value" id="statTotal">—</div><div class="stat-label">Total</div></div>
        <div class="stat-card stat-submitted"><div class="stat-value" id="statSubmitted">—</div><div class="stat-label">Submitted</div></div>
        <div class="stat-card stat-review"><div class="stat-value" id="statReview">—</div><div class="stat-label">Under Review</div></div>
        <div class="stat-card stat-assigned"><div class="stat-value" id="statAssigned">—</div><div class="stat-label">Assigned</div></div>
        <div class="stat-card stat-progress"><div class="stat-value" id="statProgress">—</div><div class="stat-label">In Progress</div></div>
        <div class="stat-card stat-resolved"><div class="stat-value" id="statResolved">—</div><div class="stat-label">Resolved</div></div>
      </div>

      <!-- Filters -->
      <div class="dashboard-filters">
        <div class="search-box">
          <span class="material-icons-round">search</span>
          <input type="text" id="searchInput" placeholder="Search by ID, name, location..." oninput="debounceSearch()">
        </div>
        <select id="statusFilter" onchange="loadComplaints()">
          <option value="All">All Statuses</option>
          <option value="Submitted">Submitted</option>
          <option value="Under Review">Under Review</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
        <select id="categoryFilter" onchange="loadComplaints()">
          <option value="All">All Categories</option>
          <option value="Pipeline Leakage">Pipeline Leakage</option>
          <option value="Overflowing Water Tank">Overflowing Water Tank</option>
          <option value="Damaged Public Tap">Damaged Public Tap</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div id="complaintsCount" style="margin-bottom: 12px; font-size: 0.9rem; font-weight: 500; color: var(--color-text-muted);"></div>

      <!-- Complaints List -->
      <div class="complaints-list" id="complaintsList">
        <p class="loading-text">Loading complaints...</p>
      </div>
    </div>
  </template>

  <!-- WORKER LOGIN PAGE -->
  <template id="tpl-worker-login">
    <div class="page-container">
      <div class="login-card">
        <div class="login-icon">
          <span class="material-icons-round">handyman</span>
        </div>
        <h1>Worker Portal</h1>
        <p>Sign in to access your assigned tasks</p>
        <form id="workerLoginForm" onsubmit="handleWorkerLogin(event)">
          <div class="form-group">
            <label for="workerUsername">Username</label>
            <input type="text" id="workerUsername" placeholder="Enter your username" required>
          </div>
          <div class="form-group">
            <label for="workerPassword">Password</label>
            <input type="password" id="workerPassword" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 0.5rem;">Sign In</button>
        </form>
      </div>
    </div>
  </template>

  <!-- WORKER DASHBOARD PAGE -->
  <template id="tpl-worker-dashboard">
    <div class="dashboard">
      <div class="dashboard-header">
        <div>
          <h1><span class="material-icons-round">engineering</span> Worker Dashboard</h1>
          <p>Welcome back, <span id="workerNameDisplay"></span></p>
        </div>
        <div>
          <button class="btn btn-outline btn-sm" onclick="loadWorkerTasks()">
            <span class="material-icons-round">refresh</span> Refresh
          </button>
          <button class="btn btn-ghost btn-sm" onclick="workerLogout()">
            <span class="material-icons-round">logout</span> Logout
          </button>
        </div>
      </div>

      <div class="stats-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 2rem;">
        <div class="stat-card">
          <div class="stat-value" id="workerPersonalCount">0</div>
          <div class="stat-label">Leader Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="workerTeamCount">0</div>
          <div class="stat-label">Team Tasks</div>
        </div>
      </div>

      <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--c-navy); margin-bottom: 1rem;">Your Tasks</h3>

      <div class="complaints-list" id="workerTasksList">
        <p class="loading-text">Loading tasks...</p>
      </div>
      
      <!-- Submit Report Modal -->
      <div id="submitReportModal" class="modal" style="display:none;">
        <div class="modal-content form-card" style="max-width: 600px;">
          <div class="modal-header">
            <h2>Submit Completion Report</h2>
            <span class="close-modal" onclick="closeSubmitReportModal()">&times;</span>
          </div>
          <form onsubmit="submitWorkerReport(event)" id="submitReportForm">
            <input type="hidden" id="reportComplaintId">
            <div class="form-group">
              <label for="reportNotes">Completion Notes <span class="required">*</span></label>
              <textarea id="reportNotes" rows="4" placeholder="Describe the work done in detail..." required></textarea>
            </div>
            <div class="form-group">
              <label>Evidence Photo <span class="required">*</span></label>
              <div class="file-upload" id="reportUploadBox" onclick="document.getElementById('reportImageInput').click()">
                <span class="material-icons-round">add_a_photo</span>
                <p>Tap to take a photo or choose from gallery</p>
                <input type="file" id="reportImageInput" accept="image/*" capture="environment" style="display: none;" onchange="handleReportImageSelect(event)" required>
              </div>
              <div id="reportImagePreviewContainer" style="display: none; margin-top: 1rem; position: relative;">
                <img id="reportImagePreview" style="width: 100%; border-radius: 8px; display: block;">
                <button type="button" class="btn btn-sm btn-danger" style="position: absolute; top: 8px; right: 8px;" onclick="clearReportImage()">
                  <span class="material-icons-round" style="font-size: 16px;">close</span> Remove
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submitReportBtn">
              <span class="material-icons-round">upload_file</span> Submit Report
            </button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <p>AquaCare — Smart Water Leakage Reporting System</p>
      <p class="footer-sub">Built as an Engineering Project • 2026</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="worker.js"></script>
</body>
</html>
